<style>

  .tcard .pay{font-size:11px;opacity:.75}.tcard .paybig{font-family:var(--serif);font-size:1.8rem;font-weight:600}
  .drop{border:1.5px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--ink-2);background:var(--surface);transition:.15s}

  .ivabig{font-family:var(--serif);font-size:2.2rem;font-weight:600;color:var(--neg)}
  .ivrow{display:flex;justify-content:space-between;font-size:13px;margin-top:10px}.track{height:8px;background:var(--line-2);border-radius:5px;overflow:hidden;margin-top:6px}.track i{display:block;height:100%;border-radius:5px}
  .empty{padding:28px 20px;text-align:center;color:var(--ink-3);font-size:13.5px}
  .chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:12px;font-weight:600;padding:5px 11px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
  table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600;padding:9px 20px;border-bottom:1px solid var(--line)}
  td{padding:10px 20px;border-top:1px solid var(--line-2);font-size:13px}td.n{font-family:var(--mono);text-align:right;font-weight:600}
  tr.total td{border-top:2px solid var(--line);font-weight:700;background:var(--surface-2)}
  .foot{color:var(--ink-3);font-size:12px;text-align:center;padding:24px}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(28,33,29,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal{background:var(--surface);border-radius:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
  .modal .mh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
  .modal .mh h3{font-family:var(--serif);font-weight:600;font-size:1.2rem}.modal .mh button{background:none;border:0;font-size:20px;color:var(--ink-3)}
  .modal .mb{padding:18px 20px}
  .seg2{display:flex;gap:8px;margin-bottom:14px}.seg2 button{flex:1;border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:9px;font-weight:600;font-size:13px;color:var(--ink-2)}
  .seg2 button.on{background:var(--pine);border-color:var(--pine);color:#f4f1ea}

<script>
try{if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";}catch(e){}
// ---- Lector de PDF: reconstruye líneas por posición (x,y) para que el texto quede en orden visual ----
async function pdfToText(file){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;let out="";
  for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();
    const lines={};tc.items.forEach(it=>{if(!it.str)return;const y=Math.round(it.transform[5]);(lines[y]=lines[y]||[]).push([it.transform[4],it.str]);});
    const ys=Object.keys(lines).map(Number).sort((a,b)=>b-a);
    out+=ys.map(y=>lines[y].sort((a,b)=>a[0]-b[0]).map(p=>p[1]).join(" ")).join("\n")+"\n";}
  return out;}
// ---- Parser de Factura AFIP (A/B/C) ----
function numAR(s){return parseFloat(String(s).replace(/\./g,'').replace(',','.'))||0;}
function parseFactura(text,myCuit){
  myCuit=(myCuit||'20292416815').replace(/\D/g,'');
  const t=text.replace(/\r/g,'').split(/\b(?:DUPLICADO|TRIPLICADO)\b/i)[0];
  const g=re=>t.match(re);
  const cod=g(/COD\.?\s*0?(\d{1,2})/);
  const letter={1:'A',6:'B',11:'C'}[cod?parseInt(cod[1]):1]||'A';
  let pv=g(/Punto de Venta:\s*(\d{1,5})\s*Comp\.?\s*Nro:\s*(\d+)/i)||g(/Punto de Venta:\s*Comp\.?\s*Nro:\s*(\d{1,5})\s+(\d+)/i);
  const fe=g(/Fecha de Emisi[oó]n:\s*(\d{2})\/(\d{2})\/(\d{4})/i);
  const neto=g(/Importe Neto Gravado:\s*\$?\s*([\d.]+,\d{2})/i);
  const total=g(/Importe Total:\s*\$?\s*([\d.]+,\d{2})/i);
  const cae=g(/CAE\s*N[°ºo]?:?\s*(\d{10,16})/i);
  let iva=0;const ivaRe=/IVA\s*[\d.]+%:\s*\$?\s*([\d.]+,\d{2})/gi;let mm;while((mm=ivaRe.exec(t))!==null)iva+=numAR(mm[1]);
  const cuits=[...t.matchAll(/CUIT:?\s*(\d{11})/gi)].map(x=>x[1]);
  const emisor=cuits[0]||'';const contra=cuits.find(c=>c!==emisor)||'';
  const esVenta=emisor.replace(/\D/g,'')===myCuit;
  const rc=g(/Apellido y Nombre\s*\/\s*Raz[oó]n Social:\s*([^\n]+)/i);
  const netoN=neto?numAR(neto[1]):0,totalN=total?numAR(total[1]):0;
  if(!iva&&totalN&&netoN)iva=+(totalN-netoN).toFixed(2);
  return{ok:!!(fe&&totalN&&(netoN||totalN)),tipo:letter,direccion:esVenta?'venta':'compra',
    punto_venta:pv?parseInt(pv[1]):null,numero:pv?parseInt(pv[2]):null,
    fecha:fe?`${fe[3]}-${fe[2]}-${fe[1]}`:null,cuit:esVenta?contra:emisor,
    razon_social:rc?rc[1].trim():null,neto:netoN,iva:iva,total:totalN,cae:cae?cae[1]:null};}
async function handleFacturaFile(file){const msg=$('facMsg');if(!file)return;
  if(!/\.pdf$/i.test(file.name)){msg.innerHTML='<span style="color:var(--neg)">Tiene que ser un PDF.</span>';return;}
  if(!window.pdfjsLib){msg.innerHTML='<span style="color:var(--neg)">No cargó el lector de PDF. Revisá tu conexión y recargá.</span>';return;}
  msg.innerHTML='Leyendo el PDF…';
  try{const txt=await pdfToText(file);const d=parseFactura(txt);
    if(!d.ok){msg.innerHTML='<span style="color:var(--neg)">No pude leer esta factura automáticamente. Cargala a mano con “+ Cargar factura”.</span>';return;}
    msg.innerHTML=`<span style="color:var(--pos)">✓ Leí la factura ${d.tipo} ${d.punto_venta?String(d.punto_venta).padStart(4,'0')+'-'+String(d.numero).padStart(8,'0'):''}. Revisá y confirmá.</span>`;
    formFactura(d);
  }catch(e){msg.innerHTML='<span style="color:var(--neg)">Error leyendo el PDF: '+esc(e.message||e)+'</span>';}}

  const vencPend=(DATA.vencs||[]).filter(x=>x.estado!=='pagado').reduce((s,x)=>s+(+x.monto||0),0);
  const dispPesos=liqARS-deudaTarj-vencPend;       // lo que te queda en pesos tras compromisos
  const dispConUSD=dispPesos+usdDisp*USD;          // idem, si usaras los dólares
  return{liqARS,invARS,usdDisp,deudaTarj,vencPend,dispPesos,dispConUSD};}

  <div id="drill_pesos" class="panel hide" style="margin:-8px 0 20px"><div class="ph"><h3>De dónde sale el patrimonio en pesos</h3><span class="meta">${arsList.length} cuentas</span></div><div class="pad" style="padding-top:2px">${arsList.map(drillRow).join('')}<div class="acct" style="border-top:2px solid var(--line);font-weight:700"><span class="cur" style="background:transparent">Σ</span><span class="an">Total en pesos</span><span class="av">${money(P.arsAccts)}</span></div></div></div>

      : `⚠️ Tus pesos líquidos (<b>${money(H.liqARS)}</b>) <b>no alcanzan</b> a cubrir lo que debés de tarjetas + impuestos (<b>${money(H.deudaTarj+H.vencPend)}</b>). Faltan <b>${money(-H.dispPesos)}</b>, que tendrías que cubrir con tus dólares (<b>${moneyU(H.usdDisp)}</b> ≈ ${money(H.usdDisp*USD)}) o tocando Bull Market. Ojo con esto.`}</div>

    <div class="mini"><div class="k">Gastos ${state.period==='mes'?'del mes':'registrados'}</div><div class="v" style="color:var(--neg)">${money(gas)}</div></div>

function srcTag(m){const t=m.tarjeta||'';if(m.nancy||/nancy/i.test(t))return `<span class="tag nancy">${t?esc(t):'Adic. Nancy'}</span>`;if(t)return `<span class="tag card">${esc(t)}</span>`;const n=accName(m.cuenta_id);return n?`<span class="tag acc">${esc(bankOf(n))}</span>`:'';}

function vCuentas(v){const bal=balances(),P=patr(bal),banks={};DATA.accts.forEach(a=>{(banks[bankOf(a.nombre)]=banks[bankOf(a.nombre)]||[]).push(a);});

// CUOTAS
function vCuotas(v){const cuo=DATA.movs.filter(m=>m.cuota_total);const banks={};cuo.forEach(m=>{const b=bankOf(m.tarjeta);(banks[b]=banks[b]||{}); const t=m.tarjeta;(banks[b][t]=banks[b][t]||[]).push(m);});
  const restante=m=>+m.monto*((m.cuota_total-m.cuota_actual)+1);
  let grand=0,html='';
  Object.entries(banks).forEach(([bank,cardsO])=>{
    html+=`<div class="panel bankgrp"><div class="bankhd"><div class="bn">🏦 ${esc(bank)}</div></div>`;
    Object.entries(cardsO).forEach(([card,items])=>{items.sort((a,b)=>(a.cuota_total-b.cuota_total)||(a.monto-b.monto));
      const totCard=items.reduce((s,m)=>s+restante(m),0);grand+=totCard;
      html+=`<div style="padding:4px 20px 2px;font-weight:600;color:var(--ink-2);font-size:13px;border-top:1px solid var(--line-2)">${esc(card)}${/nancy/i.test(card)?' · <span class="tag nancy">Nancy</span>':''}</div>
      <table><thead><tr><th>Compra</th><th>Cuota</th><th style="text-align:right">Por mes</th><th style="text-align:right">Restante</th></tr></thead><tbody>
      ${items.map(m=>`<tr><td>${esc(m.descripcion)}</td><td>${m.cuota_actual} de ${m.cuota_total}</td><td class="n">${money(m.monto)}</td><td class="n" style="color:var(--neg)">${money(restante(m))}</td></tr>`).join('')}
      <tr class="total"><td colspan="3">Total ${esc(card)}</td><td class="n">${money(totCard)}</td></tr></tbody></table>`;});
    html+=`</div>`;});
  const mensual=cuo.reduce((s,m)=>s+ +m.monto,0);
  v.innerHTML=`<div class="row3" style="margin-bottom:18px">
    <div class="mini"><div class="k">Cuotas activas</div><div class="v">${cuo.length}</div></div>
    <div class="mini"><div class="k">Total mensual (pagás por mes)</div><div class="v" style="color:var(--plum)">${money(mensual)}</div></div>
    <div class="mini"><div class="k">Total que te queda por pagar</div><div class="v" style="color:var(--neg)">${money(grand)}</div></div></div>
  ${html||'<div class="empty">Sin cuotas cargadas. Cargá los consumos de tarjeta y las cuotas aparecen acá agrupadas por banco.</div>'}`;}

// IVA
function ivaPos(){let deb=0,cred=0;DATA.comps.forEach(c=>{if(c.direccion==='venta')deb+=+c.iva;else cred+=+c.iva;});return{deb,cred,saldo:deb-cred};}
function vIva(v){const i=ivaPos(),max=Math.max(i.deb,i.cred,1),comps=DATA.comps.slice().sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  v.innerHTML=`<div class="panel" style="margin-bottom:20px"><div class="ph"><h3>Cargar factura automáticamente</h3><span class="meta">arrastrá el PDF de AFIP</span></div>
    <div class="pad"><div class="drop" id="facDrop"><div style="font-size:1.6rem">📄</div><b>Arrastrá acá el PDF de tu factura</b><div style="font-size:12.5px;margin-top:4px">Leo tipo, neto, IVA, total, CAE y fecha; detecto si es venta (débito) o compra (crédito) y te lo dejo listo para confirmar.</div><label class="pick">Elegir PDF<input type="file" id="facFile" accept="application/pdf,.pdf" style="display:none"></label></div><div id="facMsg" style="font-size:12.5px;margin-top:10px;color:var(--ink-2)"></div></div></div>
  <div class="g2" style="margin-bottom:20px"><div class="panel pad"><div style="font-size:12px;color:var(--ink-2)">Posición IVA del período (estimada)</div>
    <div class="ivabig mono">${i.deb||i.cred?money(i.saldo):'—'}</div><div style="font-size:12.5px;color:var(--ink-2);margin:2px 0 16px">${i.saldo>0?'a pagar':'saldo'} · vence aprox. día 20 del mes que viene</div>
    <div class="ivrow"><span>Débito fiscal (ventas)</span><b class="mono">${money(i.deb)}</b></div><div class="track"><i style="width:${i.deb/max*100}%;background:var(--s3)"></i></div>
    <div class="ivrow"><span>Crédito fiscal (compras)</span><b class="mono">${money(i.cred)}</b></div><div class="track"><i style="width:${i.cred/max*100}%;background:var(--s1)"></i></div></div>
    <div class="panel pad"><h3 style="margin-bottom:8px">Cómo funciona</h3><p style="font-size:13px;color:var(--ink-2)">Cada factura <b>A de venta</b> suma al débito. Cada factura <b>de compra</b> suma a tu crédito. El saldo es una estimación; tu contador liquida. El IVA se cuenta por la <b>fecha de la factura</b>.</p></div></div>
  <div class="panel"><div class="ph"><h3>Comprobantes cargados</h3><button class="add" onclick="formFactura()">+ Cargar factura</button></div>
  ${comps.length?`<table><thead><tr><th>Fecha</th><th>Tipo</th><th>Comercio</th><th>Dir.</th><th style="text-align:right">Neto</th><th style="text-align:right">IVA</th><th style="text-align:right">Total</th></tr></thead><tbody>
  ${comps.map(c=>`<tr><td>${fdate(c.fecha)}</td><td><b>${c.tipo||'—'}</b></td><td>${esc(c.razon_social||c.cuit_emisor||'—')}</td><td>${c.direccion==='venta'?'Venta':'Compra'}</td><td class="n">${money(c.neto)}</td><td class="n">${money(c.iva)}</td><td class="n">${money(c.total)}</td></tr>`).join('')}</tbody></table>`
  :'<div class="empty">Todavía no cargaste facturas. Arrastrá el PDF arriba, o tocá “+ Cargar factura”.</div>'}</div>`;wireFacturaDrop();}

// VENCIMIENTOS
function vVenc(v){const vs=(DATA.vencs||[]).slice().sort((a,b)=>(a.vence||'').localeCompare(b.vence||''));
  const prox=vs.filter(x=>x.estado!=='pagado');

// ---- FORMULARIOS (carga desde la web) ----
function closeModal(){$('modalRoot').innerHTML='';}
function modal(title,bodyHtml){$('modalRoot').innerHTML=`<div class="ov" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="mh"><h3>${title}</h3><button onclick="closeModal()">×</button></div><div class="mb">${bodyHtml}</div></div></div>`;}
function opts(arr,sel){return arr.map(o=>`<option value="${o.v}" ${o.v===sel?'selected':''}>${esc(o.t)}</option>`).join('');}
let _mtipo='gasto',_mamb='personal';
function formMov(){_mtipo='gasto';_mamb='personal';
  const cats=(DATA.cats||[]).map(c=>({v:c.id,t:(c.emoji?c.emoji+' ':'')+c.nombre}));
  const accs=[{v:'',t:'(sin cuenta)'}].concat(DATA.accts.map(a=>({v:a.id,t:a.nombre})));
  modal('Cargar movimiento',`
   <div class="seg2"><button id="mtg" class="on" onclick="_mtipo='gasto';this.classList.add('on');mig.classList.remove('on')">Gasto</button><button id="mig" onclick="_mtipo='ingreso';this.classList.add('on');mtg.classList.remove('on')">Ingreso</button></div>
   <div class="fld"><label>Monto</label><input id="f_monto" inputmode="decimal" placeholder="0"></div>
   <div class="fld"><label>Categoría</label><select id="f_cat">${opts(cats)}</select></div>
   <div class="fld"><label>Cuenta</label><select id="f_cuenta">${opts(accs)}</select></div>
   <div class="seg2"><button id="map" class="on" onclick="_mamb='personal';this.classList.add('on');maa.classList.remove('on')">Personal</button><button id="maa" onclick="_mamb='actividad';this.classList.add('on');map.classList.remove('on')">Actividad</button></div>

   <div class="fld"><label>Fecha</label><input id="f_fecha" type="date"></div>
   <button class="save" onclick="saveMov()">Guardar</button>`);
  $('f_fecha').valueAsDate=new Date();}
async function saveMov(){const monto=parseFloat(($('f_monto').value||'').replace(/\./g,'').replace(',','.'));if(!monto||monto<=0)return alert('Poné un monto válido.');
  const row={tipo:_mtipo,monto,ambito:_mamb,categoria_id:$('f_cat').value||null,cuenta_id:$('f_cuenta').value||null,descripcion:$('f_desc').value.trim()||null,fecha:$('f_fecha').value};
  await insert('movimientos',row,()=>{const cat=DATA.cats.find(c=>c.id===row.categoria_id);DATA.movs.unshift({...row,categorias:cat?{nombre:cat.nombre,emoji:cat.emoji}:null});});closeModal();render();}
function formCuenta(){modal('Agregar cuenta',`
   <div class="fld"><label>Nombre</label><input id="c_nom" placeholder="Ej: Banco Nación · C.A."></div>

   <button class="save" onclick="saveCuenta()">Guardar</button>`);}
async function saveCuenta(){const row={nombre:$('c_nom').value.trim(),tipo:$('c_tipo').value,moneda:$('c_mon').value,saldo:parseFloat(($('c_saldo').value||'0').replace(/\./g,'').replace(',','.'))||0};if(!row.nombre)return alert('Ponele nombre.');
  await insert('cuentas',row,()=>DATA.accts.push({...row,id:'tmp'+Date.now()}));closeModal();render();}
let _fdir='compra';
const nAR=n=>(+n||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
function formFactura(pre){pre=pre||{};_fdir=pre.direccion||'compra';const leido=!!pre.ok;
  const cae=pre.cae||'',pv=pre.punto_venta?String(pre.punto_venta).padStart(4,'0')+'-'+String(pre.numero).padStart(8,'0'):'';

   <div class="seg2"><button id="fdc" class="${_fdir==='compra'?'on':''}" onclick="_fdir='compra';this.classList.add('on');fdv.classList.remove('on')">Compra (crédito)</button><button id="fdv" class="${_fdir==='venta'?'on':''}" onclick="_fdir='venta';this.classList.add('on');fdc.classList.remove('on')">Venta (débito)</button></div>
   <div class="fld"><label>Tipo</label><select id="v_tipo">${opts([{v:'A',t:'A'},{v:'B',t:'B'},{v:'C',t:'C'}],pre.tipo)}</select></div>

   <div class="fld"><label>CUIT</label><input id="v_cuit" placeholder="30-xxxxxxxx-x" value="${esc(pre.cuit||'')}"></div>
   <div class="fld"><label>Neto gravado</label><input id="v_neto" inputmode="decimal" value="${pre.neto?nAR(pre.neto):''}" oninput="v_iva.value=nAR((parseFloat(this.value.replace(/\\./g,'').replace(',','.'))||0)*0.21)"></div>
   <div class="fld"><label>IVA (editable)</label><input id="v_iva" inputmode="decimal" value="${pre.iva?nAR(pre.iva):''}"></div>
   <div class="rowf" style="display:flex;gap:10px"><div class="fld" style="flex:1"><label>Fecha</label><input id="v_fecha" type="date" value="${esc(pre.fecha||'')}"></div><div class="fld" style="flex:1"><label>CAE</label><input id="v_cae" value="${esc(cae)}" placeholder="—"></div></div>
   <input type="hidden" id="v_pv" value="${pre.punto_venta||''}"><input type="hidden" id="v_nro" value="${pre.numero||''}">
   <button class="save" onclick="saveFactura()">${leido?'Confirmar y guardar':'Guardar factura'}</button>`);
  if(!pre.fecha)$('v_fecha').valueAsDate=new Date();}
async function saveFactura(){const neto=parseFloat(($('v_neto').value||'0').replace(/\./g,'').replace(',','.'))||0,iva=parseFloat(($('v_iva').value||'0').replace(/\./g,'').replace(',','.'))||0;

    cae:$('v_cae').value.trim()||null,punto_venta:parseInt($('v_pv').value)||null,numero:parseInt($('v_nro').value)||null};
  await insert('comprobantes',row,()=>DATA.comps.unshift(row));closeModal();render();}
function formVenc(){const accs=[{v:'',t:'(elegí cuenta)'}].concat(DATA.accts.map(a=>({v:a.id,t:a.nombre})));

async function saveVenc(){const row={concepto:$('x_con').value.trim(),cuenta_id:$('x_cta').value||null,monto:parseFloat(($('x_monto').value||'0').replace(/\./g,'').replace(',','.'))||0,vence:$('x_vence').value,cuota_actual:parseInt($('x_ca').value)||null,cuota_total:parseInt($('x_ct').value)||null,saldo_pendiente:parseFloat(($('x_saldo').value||'0').replace(/\./g,'').replace(',','.'))||null,estado:'pendiente'};

async function insert(table,row,demoFn){if(DEMO||!session){demoFn&&demoFn();return;}
  const r={...row,user_id:session.user.id};const {error}=await db.from(table).insert(r);if(error){alert('No se pudo guardar: '+error.message);throw error;}await load();}

function fdateLong(d){try{return new Date(d+'T00:00:00').toLocaleDateString('es-AR',{day:'2-digit',month:'short',year:'2-digit'});}catch(e){return d||'';}}
