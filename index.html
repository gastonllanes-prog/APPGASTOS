<style>

<script>
try{if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";}catch(e){}
// ---- Lector de PDF: reconstruye líneas por posición (x,y) para que el texto quede en orden visual ----
async function pdfToText(file){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;let out="";
  for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();
    const lines={};tc.items.forEach(it=>{if(!it.str)return;const y=Math.round(it.transform[5]);(lines[y]=lines[y]||[]).push([it.transform[4],it.str]);});
    const ys=Object.keys(lines).map(Number).sort((a,b)=>b-a);
    out+=ys.map(y=>lines[y].sort((a,b)=>a[0]-b[0]).map(p=>p[1]).join(" ")).join("\n")+"\n";}
  return out;}
// ---- Parser de Factura AFIP (A/B/C) ----
function numAR(s){return parseFloat(String(s).replace(/\./g,'').replace(',','.'))||0;}
function parseFactura(text,myCuit){
  myCuit=(myCuit||'20292416815').replace(/\D/g,'');
  const t=text.replace(/\r/g,'').split(/\b(?:DUPLICADO|TRIPLICADO)\b/i)[0];
  const g=re=>t.match(re);
  const cod=g(/COD\.?\s*0?(\d{1,2})/);
  const letter={1:'A',6:'B',11:'C'}[cod?parseInt(cod[1]):1]||'A';
  let pv=g(/Punto de Venta:\s*(\d{1,5})\s*Comp\.?\s*Nro:\s*(\d+)/i)||g(/Punto de Venta:\s*Comp\.?\s*Nro:\s*(\d{1,5})\s+(\d+)/i);
  const fe=g(/Fecha de Emisi[oó]n:\s*(\d{2})\/(\d{2})\/(\d{4})/i);
  const neto=g(/Importe Neto Gravado:\s*\$?\s*([\d.]+,\d{2})/i);
  const total=g(/Importe Total:\s*\$?\s*([\d.]+,\d{2})/i);

function lastCierreW(day){const t=todayW();let d=new Date(t.getFullYear(),t.getMonth(),day);if(d>t)d=new Date(t.getFullYear(),t.getMonth()-1,day);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

// Arregla (a) que no quede clavada en 1/N y (b) que la última cuota (cur==total) SÍ cuente.
function cuotaCur(m){if(!m.cuota_total)return null;const total=+m.cuota_total,base=+m.cuota_actual||1;
  const ref=m.created_at?new Date(m.created_at):new Date((m.fecha||'')+'T00:00:00');const t=todayW();
  let el=(t.getFullYear()-ref.getFullYear())*12+(t.getMonth()-ref.getMonth());if(el<0||isNaN(el))el=0;
  const cur=base+el;return{cur,total,actual:Math.min(cur,total),activa:cur>=1&&cur<=total,restantesIncl:Math.max(0,total-cur+1)};}
function cardEstimate(card){const cy=CYCLES[card]||{cierre:1,vto:10};const cierre=lastCierreW(cy.cierre);const ms=DATA.movs.filter(m=>m.tarjeta===card);
  const cuotasMes=ms.filter(m=>{const c=cuotaCur(m);return c&&c.activa;}).reduce((s,m)=>s+ +m.monto,0);
  const ciclo=ms.filter(m=>!m.cuota_total&&(m.fecha||'')>cierre).reduce((s,m)=>s+ +m.monto,0);

// GASTOS
// Rango de fechas propio de la pantalla Gastos (para ver "cuánto voy gastando" entre 2 fechas).
let gRange=null;
function gMesRange(off){const t=todayW();const d=new Date(t.getFullYear(),t.getMonth()+off,1),y=d.getFullYear(),m=d.getMonth();
  const p=n=>String(n).padStart(2,'0');const first=`${y}-${p(m+1)}-01`;
  const hoy=`${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())}`;
  const last=`${y}-${p(m+1)}-${p(new Date(y,m+1,0).getDate())}`;
  return {desde:first,hasta:last};}   // mes completo (así no se esconde un gasto fechado más adelante en el mes)
function gDefaults(){return gMesRange(0);}
function gQuick(which){gRange=which==='todo'?{desde:'',hasta:''}:which==='prev'?gMesRange(-1):gMesRange(0);render();}
function gSetFecha(campo,val){if(!gRange)gRange=gDefaults();gRange[campo]=val;render();}
function vGastos(v){
  if(!gRange)gRange=gDefaults();
  let g=DATA.movs.filter(m=>m.tipo==='gasto');
  if(state.scope!=='todo')g=g.filter(m=>m.ambito===state.scope);
  if(gRange.desde)g=g.filter(m=>(m.fecha||'')>=gRange.desde);
  if(gRange.hasta)g=g.filter(m=>(m.fecha||'')<=gRange.hasta);
  const cats=catAgg(g),max=cats[0]?cats[0].v:1;
  const cuotasR=g.filter(m=>{const c=cuotaCur(m);return c&&c.activa;}).reduce((s,m)=>s+ +m.monto,0);
  const unicos=g.filter(m=>!m.cuota_total).reduce((s,m)=>s+ +m.monto,0);
  const rotulo=(gRange.desde||gRange.hasta)?`${gRange.desde?fdate(gRange.desde):'inicio'} → ${gRange.hasta?fdate(gRange.hasta):'hoy'}`:'todo el historial';
  const inp='padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--raised);font-size:13px';
  v.innerHTML=`<div class="panel pad" style="margin-bottom:16px;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap">
    <div><div style="font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px">Desde</div><input type="date" value="${gRange.desde||''}" onchange="gSetFecha('desde',this.value)" style="${inp}"></div>
    <div><div style="font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px">Hasta</div><input type="date" value="${gRange.hasta||''}" onchange="gSetFecha('hasta',this.value)" style="${inp}"></div>
    <div class="chips" style="margin-left:auto"><button class="chip" onclick="gQuick('mes')">Este mes</button><button class="chip" onclick="gQuick('prev')">Mes pasado</button><button class="chip" onclick="gQuick('todo')">Todo</button></div>
  </div>
  <div class="row3" style="margin-bottom:18px">
    <div class="mini"><div class="k">Gasto del período (sin cuotas)</div><div class="v">${money(unicos)}</div><div style="font-size:11px;color:var(--ink-3);margin-top:3px">${rotulo}</div></div>
    <div class="mini"><div class="k">Cuotas activas en el rango</div><div class="v" style="color:var(--plum)">${money(cuotasR)}</div></div>
    <div class="mini"><div class="k">Total</div><div class="v" style="color:var(--neg)">${money(unicos+cuotasR)}</div></div></div>
  <div class="panel">${cats.map(c=>catRow(c,max)).join('')||'<div class="empty">Sin gastos en este rango. Cambiá las fechas o cargá con “+ Cargar”.</div>'}</div>`;wireCats(v);}
function catRow(c,max){return `<div class="catrow"><button class="catbtn" aria-expanded="false"><span class="em">${c.e}</span><span class="nm">${esc(c.n)}</span><span class="bar"><i style="width:${Math.max(4,c.v/max*100)}%;background:${catColor(c.n)}"></i></span><span class="amt">${money(c.v)}</span><span class="chev">›</span></button><div class="subs hide">${c.items.sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')).map(txHtml).join('')}</div></div>`;}
function txHtml(m){const cc=m.cuota_total?cuotaCur(m):null;const cuo=cc?`<span class="tag cuo">cuota ${cc.actual}/${cc.total}</span>`:'';const rc=m.id?`<button class="recat" title="Cambiar categoría" onclick="formReCat('${m.id}')">⋯</button>`:'';return `<div class="txrow"><span class="d">${fdate(m.fecha)}</span><span class="t">${esc(m.descripcion||(m.categorias&&m.categorias.nombre)||'Gasto')}</span>${cuo}${srcTag(m)}<span class="amt">${money(m.monto)}</span>${rc}</div>`;}
function formReCat(id){const m=DATA.movs.find(x=>x.id===id);if(!m)return;
  const cats=(DATA.cats||[]).slice().sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(c=>({v:c.id,t:(c.emoji?c.emoji+' ':'')+c.nombre}));

   <button class="save" onclick="saveReCat('${id}')">Guardar</button>`);}
async function saveReCat(id){const cid=$('rc_cat').value;const cat=DATA.cats.find(c=>c.id===cid);
  const m=DATA.movs.find(x=>x.id===id);if(m){m.categoria_id=cid;m.categorias=cat?{nombre:cat.nombre,emoji:cat.emoji}:m.categorias;}
  if(!DEMO&&session){const {error}=await db.from('movimientos').update({categoria_id:cid}).eq('id',id);if(error){alert('No se pudo guardar: '+error.message);return;}}
  closeModal();render();}
function srcTag(m){const t=m.tarjeta||'';if(m.nancy||/nancy/i.test(t))return `<span class="tag nancy">${t?esc(t):'Adic. Nancy'}</span>`;if(t)return `<span class="tag card">${esc(t)}</span>`;const n=accName(m.cuenta_id);return n?`<span class="tag acc">${esc(bankOf(n))}</span>`:'';}
function wireCats(root){root.querySelectorAll('.catbtn').forEach(b=>b.onclick=()=>{const ex=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',!ex);b.parentElement.querySelector('.subs').classList.toggle('hide',ex);});}

// Se guardan en Storage (bucket privado "comprobantes"), ruta {uid}/resumenes/{banco}/{ts}-{archivo}.
// No hace falta tabla: el listado sale del propio Storage.
const RESUM_BANCOS=[{slug:'macro',name:'Macro'},{slug:'santander',name:'Santander'},{slug:'bbva',name:'BBVA'},{slug:'mercadopago',name:'Mercado Pago'},{slug:'afip',name:'AFIP / ARCA'},{slug:'otro',name:'Otro'}];
const RESUM_BUCKET='comprobantes';
const fmtSize=b=>b>=1e6?(b/1e6).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const cleanName=fn=>String(fn).replace(/^\d{10,}-/,'');
function periodoDe(name){const s=String(name);const m=s.match(/(20\d{2})[-_.]?(0[1-9]|1[0-2])(?!\d)/)||s.match(/(0[1-9]|1[0-2])[-_.](20\d{2})/);if(!m)return '';const y=m[1].length===4?m[1]:m[2],mo=m[1].length===4?m[2]:m[1];return mo+'/'+y;}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);}
function loadJSZip(){return window.JSZip?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';s.onload=res;s.onerror=()=>rej(new Error('No cargó JSZip'));document.head.appendChild(s);});}
let _resumBanco='macro';
function vResum(v){

  const chips=RESUM_BANCOS.map(b=>`<button class="chip resb" data-slug="${b.slug}" style="${b.slug===_resumBanco?'background:var(--pine);color:#fff;border-color:var(--pine)':''}">${esc(b.name)}</button>`).join('');
  v.innerHTML=`<div class="panel" style="margin-bottom:20px"><div class="ph"><h3>Subir resumen</h3><span class="meta">PDF o imagen · se guarda por banco</span></div>
    <div class="pad">
      <div style="font-size:12px;color:var(--ink-2);margin-bottom:8px">¿De qué banco es?</div>
      <div class="chips" id="resChips" style="margin-bottom:14px">${chips}</div>
      <div class="drop" id="resDrop"><div style="font-size:1.6rem">📎</div><b>Arrastrá el resumen acá</b><div style="font-size:12.5px;margin-top:4px">Se guarda en tu bóveda privada. Después lo bajás, o se lo exportás al contador por banco.</div><label class="pick">Elegir archivo<input type="file" id="resFile" accept="application/pdf,image/*" style="display:none"></label></div>
      <div id="resMsg" style="font-size:12.5px;margin-top:10px;color:var(--ink-2)"></div>

function wireResum(){
  document.querySelectorAll('#resChips .resb').forEach(b=>b.onclick=()=>{_resumBanco=b.dataset.slug;vResum($('view'));});

  if(fi)fi.onchange=e=>{if(e.target.files[0])doUploadResum(e.target.files[0]);};}
async function doUploadResum(file){const msg=$('resMsg');const uid=session.user.id;
  const safe=file.name.replace(/[^\w.\-]+/g,'_');const path=`${uid}/resumenes/${_resumBanco}/${Date.now()}-${safe}`;
  msg.innerHTML='Subiendo…';
  const {error}=await db.storage.from(RESUM_BUCKET).upload(path,file,{upsert:false,contentType:file.type||'application/octet-stream'});
  if(error){msg.innerHTML='<span style="color:var(--neg)">No se pudo subir: '+esc(error.message)+'</span>';return;}
  msg.innerHTML='<span style="color:var(--pos)">✓ Subido.</span>';loadResumList();}
async function listResumAll(){const uid=session.user.id;const res=[];
  for(const b of RESUM_BANCOS){const {data}=await db.storage.from(RESUM_BUCKET).list(`${uid}/resumenes/${b.slug}`,{limit:200,sortBy:{column:'name',order:'desc'}});
    (data||[]).forEach(f=>{if(f.name&&f.id!==null)res.push({slug:b.slug,banco:b.name,name:f.name,path:`${uid}/resumenes/${b.slug}/${f.name}`,size:(f.metadata&&f.metadata.size)||0});});}
  return res;}
async function loadResumList(){const box=$('resList');if(!box)return;
  let all;try{all=await listResumAll();}catch(e){box.innerHTML='<div class="empty">No pude leer los resúmenes: '+esc(e.message||e)+'</div>';return;}
  if(!all.length){box.innerHTML='<div class="empty">Todavía no subiste ningún resumen. Elegí el banco y arrastrá el PDF arriba.</div>';return;}
  const byBank={};all.forEach(f=>{(byBank[f.banco]=byBank[f.banco]||[]).push(f);});
  box.innerHTML=Object.entries(byBank).map(([banco,files])=>`<div class="panel bankgrp"><div class="bankhd"><div class="bn">📎 ${esc(banco)} <span style="font-weight:500;color:var(--ink-3);font-size:12px">· ${files.length}</span></div><button class="add" data-zip="${files[0].slug}" data-zipn="${esc(banco)}">⬇ Descargar todo</button></div>
    ${files.map(f=>{const cn=cleanName(f.name),per=periodoDe(cn);return `<div class="acct"><span class="an">${esc(cn)}${per?` <span class="tag cuo">${per}</span>`:''}</span><span style="color:var(--ink-3);font-size:12px;margin-right:10px">${fmtSize(f.size)}</span><button data-dl="${esc(f.path)}" data-dln="${esc(cn)}" style="background:var(--pine-wash);color:var(--pine-ink);border:0;border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;margin-right:6px;cursor:pointer">Descargar</button><button data-del="${esc(f.path)}" style="background:transparent;border:0;color:var(--ink-3);font-size:15px;cursor:pointer">🗑</button></div>`;}).join('')}</div>`).join('');
  box.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>dlResum(b.dataset.dl,b.dataset.dln));
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delResum(b.dataset.del));
  box.querySelectorAll('[data-zip]').forEach(b=>b.onclick=()=>zipBanco(b.dataset.zip,b.dataset.zipn));}
async function dlResum(path,name){const {data,error}=await db.storage.from(RESUM_BUCKET).createSignedUrl(path,120,{download:name});if(error){alert('No se pudo: '+error.message);return;}window.open(data.signedUrl,'_blank');}
async function delResum(path){if(!confirm('¿Borrar este resumen? No se puede deshacer.'))return;const {error}=await db.storage.from(RESUM_BUCKET).remove([path]);if(error){alert('No se pudo borrar: '+error.message);return;}loadResumList();}
async function zipBanco(slug,banco){const uid=session.user.id;
  try{await loadJSZip();
    const {data}=await db.storage.from(RESUM_BUCKET).list(`${uid}/resumenes/${slug}`,{limit:200});
    const files=(data||[]).filter(f=>f.id!==null);
    if(!files.length){alert('No hay archivos de '+banco+'.');return;}
    const zip=new JSZip();
    for(const f of files){const p=`${uid}/resumenes/${slug}/${f.name}`;const su=await db.storage.from(RESUM_BUCKET).createSignedUrl(p,180);if(su.error)continue;const blob=await fetch(su.data.signedUrl).then(r=>r.blob());zip.file(cleanName(f.name),blob);}
    const out=await zip.generateAsync({type:'blob'});downloadBlob(out,`resumenes-${slug}.zip`);
  }catch(e){alert('No pude armar el ZIP: '+(e.message||e));}}
